# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#
# adam.yml (Adam's personal sandbox fleet)
#
# A showcase of the shared library: everything here is generic,
# sanitized, and safe to run on test machines (no STIG lockdown,
# no app removal, no remediation that fights you while testing).
#
# To copy something into your own fleet, copy the matching entry
# below. Before changing a shared file under platforms/, run:
#   python3 tools/check-conventions.py --who-uses <path>
#
# Reference: https://fleetdm.com/docs/configuration/yaml-files
#
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# Never change `name:` on its own: GitOps would delete and recreate the fleet.
# See docs/runbooks/fleet-rename.md.
name: "Adam's Adequate Fleet"

agent_options:
  config:
    decorators:
      load:
        - SELECT uuid AS host_uuid FROM system_info;
        - SELECT hostname AS hostname FROM system_info;

settings:
  features:
    enable_host_users: false
    enable_software_inventory: true
    historical_data:
      uptime: true
      vulnerabilities: false
  # Enroll secrets are managed in the Fleet UI. To manage them
  # with GitOps instead, uncomment and replace the placeholder:
  # secrets:
  #   - secret: <FLEET_ENROLL_SECRET_ADAM>

controls:
  setup_experience:
    # apple_setup_assistant: ../platforms/macos/enrollment-profiles/automatic-enrollment.dep.json
    # enable_end_user_authentication: true

  ###########################################################
  # Apple: configuration profiles and DDM declarations
  ###########################################################
  apple_settings:
    configuration_profiles:
      # fleetd / osquery need Full Disk Access for file-based tables
      - path: ../platforms/macos/configuration-profiles/fleetd-pppc-full-disk-access.mobileconfig
      # Light security baseline
      - path: ../platforms/macos/configuration-profiles/firewall-stealth-mode.mobileconfig
      - path: ../platforms/macos/configuration-profiles/login-window-settings.mobileconfig
      - path: ../platforms/macos/configuration-profiles/diagnostics-settings-disable-sharing.mobileconfig
      # Apps
      - path: ../platforms/macos/configuration-profiles/chrome-settings.mobileconfig
      - path: ../platforms/macos/configuration-profiles/claude-settings.mobileconfig
      - path: ../platforms/macos/configuration-profiles/microsoft-autoupdate-settings.mobileconfig
      - path: ../platforms/macos/configuration-profiles/zoom-pppc-system-extension.mobileconfig
      # DDM
      - path: ../platforms/macos/declaration-profiles/softwareupdate-settings-automatic.json
      # iOS
      - path: ../platforms/ios/configuration-profiles/cis-l1-passcode.mobileconfig
      - path: ../platforms/ios/declaration-profiles/softwareupdate-settings-ios.json

  windows_settings:
    configuration_profiles:
      - path: ../platforms/windows/configuration-profiles/chrome-extensions-blocklist.xml
    require_bitlocker_pin: true

  enable_disk_encryption: true

  macos_updates:
    deadline: "2026-12-15"
    minimum_version: "26.1"
    update_new_hosts: false

  windows_updates:
    deadline_days: 7
    grace_period_days: 2

  ###########################################################
  # Script library: every shared script, so it's runnable
  # from Host details and usable by policy automations.
  ###########################################################
  scripts:
    # macOS: run from Host details > Scripts
    - path: ../platforms/macos/scripts/flush-dns-cache.sh
    - path: ../platforms/macos/scripts/install-rosetta.sh
    - path: ../platforms/macos/scripts/reset-onedrive.sh
    - path: ../platforms/macos/scripts/remove-jamf-agent.sh
    - path: ../platforms/macos/scripts/show-bluetooth-menubar.sh
    # Linux: used by the firewall policy below
    - path: ../platforms/linux/scripts/enable-ufw-firewall.sh

###########################################################
# Reports
###########################################################
reports:
  # Cross-platform
  - path: ../platforms/all/reports/listening-ports.yml
  - path: ../platforms/all/reports/usb-devices.yml
  - path: ../platforms/all/reports/chromium-browser-extensions.yml
  # macOS
  - path: ../platforms/macos/reports/admin-users.yml
  - path: ../platforms/macos/reports/failing-batteries.yml
  - path: ../platforms/macos/reports/xprotect-reports.yml
  - path: ../platforms/macos/reports/intel-only-apps-macos-27.yml
  - path: ../platforms/macos/reports/default-browser.yml
  - path: ../platforms/macos/reports/apple-intelligence.yml
  - path: ../platforms/macos/reports/memory-heavy-apps.yml

###########################################################
# Policies & automations
###########################################################
policies:
  # Cross-platform
  - path: ../platforms/all/policies/host-restarted-within-30-days.yml
  # macOS: compliance
  - path: ../platforms/macos/policies/all-software-updates-installed.yml
  - path: ../platforms/macos/policies/filevault-key-escrowed.yml
  - path: ../platforms/macos/policies/disk-space-for-updates-available.yml
  - path: ../platforms/macos/policies/root-ssh-authorized-keys-absent.yml
  - path: ../platforms/macos/policies/openclaw-not-detected.yml
  # macOS: self-healing (policy fails -> script fixes it)
  - path: ../platforms/macos/policies/rosetta-installed.yml
  # macOS: fixed by an MDM command (tools/mdm-commands/, job "Enable Remote Desktop")
  - path: ../platforms/macos/policies/remote-management-enabled.yml
  # macOS: patch policies (each needs its Fleet-maintained app below)
  - path: ../platforms/macos/policies/google-chrome-up-to-date.yml
  - path: ../platforms/macos/policies/slack-up-to-date.yml
  - path: ../platforms/macos/policies/zoom-up-to-date.yml
  - path: ../platforms/macos/policies/1password-up-to-date.yml
  - path: ../platforms/macos/policies/claude-up-to-date.yml
  # Linux
  - path: ../platforms/linux/policies/firewall-enabled.yml
  - path: ../platforms/linux/policies/luks-root-filesystem-encrypted.yml
  # Windows
  - path: ../platforms/windows/policies/bitlocker-startup-pin-set.yml

###########################################################
# Software
###########################################################
software:
  fleet_maintained_apps:
    # macOS
    - slug: google-chrome/darwin
      self_service: true
      categories: [Browsers]
    - slug: slack/darwin
      self_service: true
      categories: [Communication]
    - slug: zoom/darwin
      self_service: true
      categories: [Communication]
    - slug: 1password/darwin
      self_service: true
      categories: [Productivity]
    - slug: claude/darwin
      self_service: true
      categories: [Productivity]
    # Windows
    - slug: google-chrome/windows
      self_service: true
      categories: [Browsers]
  packages: []
  app_store_apps: []
