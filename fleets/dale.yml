# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#
# dale.yml
#
# Use this fleet manifest to configure controls, software,
# automations, policies, and reports that apply only to
# computing devices (hosts) in this particular fleet.
#
# > Note: By convention, the "Dale's" fleet is
# > where all Dale's test laptops, PCs, and other
# > productivity endpoints (i.e. computers) are enrolled.
#
# To see all supported options, check out:
#   • https://fleetdm.com/docs/configuration/yaml-files
#
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
name: "Dale's Fleet"
###########################################################
# Agent options
#
# Configure osquery and Fleet's agent (fleetd) for hosts in
# this fleet.
#
# Read more:
#   • https://fleetdm.com/docs/configuration/agent-configuration
###########################################################
agent_options:
  config:
    decorators:
      load:
        - SELECT uuid AS host_uuid FROM system_info;
        - SELECT hostname AS hostname FROM system_info;
    options:
      disable_distributed: false
      distributed_interval: 10
      distributed_plugin: tls
      distributed_tls_max_attempts: 3
      logger_tls_endpoint: /api/osquery/log
      logger_tls_period: 11
      pack_delimiter: /
  update_channels:
    desktop: stable
    orbit: stable
    osqueryd: stable

###########################################################
# Fleet settings
#
# Read more:
#   • https://fleetdm.com/docs/configuration/yaml-files#settings
###########################################################
settings:
  # Enroll secrets are managed in the Fleet UI. To manage them
  # with GitOps instead, uncomment and replace the placeholder:
  # secrets:
  #   - secret: <FLEET_ENROLL_SECRET_DALE>

controls:
  setup_experience:
    ###########################################################
    # Configure the macOS setup experience
    #
    # (Optional) edit the automatic enrollment profile referenced
    # here to change which items are skipped during macOS setup
    # and other aspects of the end user's experience during
    # their first few minutes with their new Mac.
    #
    # Note: This requires activating MDM in your Fleet instance.
    #
    # For more, see:
    #   • https://fleetdm.com/guides/apple-mdm-setup
    #   • https://fleetdm.com/docs/configuration/yaml-files#macos-setup
    #   • https://developer.apple.com/documentation/devicemanagement/profile
    #   • https://support.apple.com/guide/deployment/automated-device-enrollment-management-dep73069dd57/web
    ###########################################################
    # apple_setup_assistant: ../platforms/macos/enrollment-profiles/automatic-enrollment.dep.json

    ###########################################################
    # Uncomment to use single-sign on (SSO) to authenticate
    # end users during first-time setup of new computers.
    #
    # Read more:
    #   • https://fleetdm.com/docs/configuration/yaml-files#end-user-authentication
    #   • https://fleetdm.com/guides/setup-experience#require-idp-authentication
    ###########################################################
    # enable_end_user_authentication: true

  ###########################################################
  # Configuration profiles
  #
  # Note: This requires activating MDM in your Fleet instance.
  #
  # For more, see:
  #   • https://fleetdm.com/guides/apple-mdm-setup
  #   • https://fleetdm.com/guides/windows-mdm-setup
  #   • https://fleetdm.com/docs/configuration/yaml-files#apple-settings-and-windows-settings
  #
  # Profiles can be scoped using labels.  For example:
  # ```
  # - path: ../platforms/macos/configuration-profiles/1password-managed-settings.mobileconfig
  #   labels_include_any:
  #     - "Macs with 1Password installed"
  # - paths: ../platforms/windows/configuration-profiles/*.xml
  #   labels_include_all:
  #     - "x86-based Windows hosts"
  # ```
  ###########################################################
  apple_settings:
    configuration_profiles:
      - path: "../platforms/macos/configuration-profiles/fleetd-pppc-full-disk-access.mobileconfig"
      - path: "../platforms/macos/declaration-profiles/softwareupdate-defer-macos-major.json"
  windows_settings:
    configuration_profiles:
      - path: "../platforms/windows/configuration-profiles/create-hyperv-wsl-vm.xml"

  ###########################################################
  # Managed disk encryption
  #
  # To enable and enforce disk encryption with key escrow on
  # all supported platforms, uncomment `enable_disk_encryption`.
  #
  # Read more here:
  #   • https://fleetdm.com/guides/enforce-disk-encryption
  ###########################################################
  # enable_disk_encryption: true

  ###########################################################
  # Managed OS updates
  #
  # To enable and enforce managed OS updates on macOS/Windows,
  # uncomment `macos_updates` and `windows_updates`.
  #
  # See also:
  #   • https://fleetdm.com/docs/configuration/yaml-files#macos-updates
  #   • https://fleetdm.com/docs/configuration/yaml-files#windows-updates
  #   • https://fleetdm.com/guides/enforce-os-updates
  ###########################################################
  macos_updates:
    deadline: "2026-06-05"
    minimum_version: "26.4"
    update_new_hosts: false
  # windows_updates:
  #   deadline_days: 7
  #   grace_period_days: 2

  ###########################################################
  # Script library
  #
  # > To make a script available for use with Fleet for helpdesk
  # > use cases and in your custom automations, add it to the
  # > appropriate folder for the primary platform where it is
  # > intended to run, then list it below with `path`.
  ###########################################################
  scripts:
    - path: ../platforms/macos/scripts/fleetd_healthcheck_macos.sh

###########################################################
# Reports
#
# > To set up a report in Fleet for collecting data, add it
# > as a .yml file in `platforms/all/reports/` or, if it is
# > specific to a particular platform, in the appropriate
# > folder for that platform, then list it below with `path`.
###########################################################
reports: []

###########################################################
# Policies & automations
#
# > To set up a policy in Fleet to implement automations or
# > ensure compliance with organizational security standards
# > or regulations, add it as a .yml file in the appropriate
# > folder for the primary platform where it is intended to
# > run (or `platforms/all/policies/` if it runs on several),
# > then list it below with `path`.
###########################################################
policies:
  - path: ../platforms/macos/policies/all-software-updates-installed.yml

###########################################################
# Software available for install
#
# Read more here:
#   •  https://fleetdm.com/docs/configuration/yaml-files#software
###########################################################
software:
  fleet_maintained_apps:
    # macOS apps
    # …
    - slug: slack/darwin # Slack for macOS
      self_service: true
      setup_experience: true
      categories:
    #     - Communication
    #     - Productivity

    - slug: firefox/darwin # Firefox for macOS
      self_service: false
      setup_experience: true
      categories:
    #     - Communication
    #     - Productivity

    # Windows apps
    # …
    # - slug: slack/windows # Slack for Windows
    #   self_service: true
    #   setup_experience: true
    #   categories:
    #     - Productivity
    #     - Communication
    #   labels_include_any:
    #     - "x86-based Windows hosts"

  packages: # Custom packages (if any)
    # macOS custom packages
    # …

    # Windows custom packages
    # …

    # Linux custom packages
    # …

  app_store_apps: # Apps to install via VPP from the macOS App Store, if any
    # …
