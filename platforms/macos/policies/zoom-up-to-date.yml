# Patch policy for Zoom (Fleet-maintained app).
#
# DEPENDS ON: `zoom/darwin` listed under this fleet's software.fleet_maintained_apps.
# install_software only works when that app is in the same fleet as this policy.
#
# `type: patch` generates the version check from the FMA metadata: a host fails only when
# Zoom is installed and older than the latest maintained version (a missing app passes).
# patch_when_closed: Fleet installs only while the app is not running.
- name: macOS - Zoom up to date
  type: patch
  fleet_maintained_app_slug: zoom/darwin
  install_software: true
  patch_when_closed: true
  description: Checks that Zoom is up to date if installed.
  resolution: Fleet updates Zoom automatically once it is closed.
