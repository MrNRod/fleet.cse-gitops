# Patch policy for 1Password (Fleet-maintained app).
#
# DEPENDS ON: `1password/darwin` listed under this fleet's software.fleet_maintained_apps.
# install_software only works when that app is in the same fleet as this policy.
#
# `type: patch` generates the version check from the FMA metadata: a host fails only when
# 1Password is installed and older than the latest maintained version (a missing app passes).
# patch_when_closed: Fleet installs only while the app is not running.
- name: macOS - 1Password up to date
  type: patch
  fleet_maintained_app_slug: 1password/darwin
  install_software: true
  patch_when_closed: true
  description: Checks that 1Password is up to date if installed.
  resolution: Fleet updates 1Password automatically once it is closed.
